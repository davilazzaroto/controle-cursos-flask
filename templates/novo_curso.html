<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />


    <title>Document</title>
  </head>
  <body>
    <h1>Cadastrar Novo Curso</h1>
    <form action="" method="POST">
        Titulo:
      <input type="text" name="titulo" placeholder="Título do Curso" required />
      Descrição:
      <input
        type="text"
        name="descricao"
        placeholder="Descrição do Curso"
        required
      />
      Plataforma:
      <input
        type="text"
        name="plataforma"
        placeholder="Plataforma do Curso"
        required
      />
      <input type="submit" value="Cadastrar Curso" />
      <button><a href="{{ url_for('cursos') }}">Voltar</a></button>
    </form>
  </body>
</html>
